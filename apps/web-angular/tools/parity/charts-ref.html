<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .box { width: var(--w); position: relative; margin: 0 0 20px 0; }
</style>
<script src="../../../../node_modules/react/umd/react.production.min.js"></script>
<script src="../../../../node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script src="../../../../node_modules/react-is/umd/react-is.production.min.js"></script>
<script src="../../../../node_modules/recharts/umd/Recharts.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const { PieChart, Pie, Cell, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid } = Recharts;
const ANIM = !location.search.includes('anim=0') ? true : false;

const hexToRgb = (hex) => { const x = hex.replace('#',''); return [parseInt(x.slice(0,2),16), parseInt(x.slice(2,4),16), parseInt(x.slice(4,6),16)]; };
const rgbToHex = ([r,g,b]) => '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
function navyRamp(n) { const s = hexToRgb('#0D2240'), e = hexToRgb('#93AAC6'); if (n <= 1) return ['#0D2240']; return Array.from({length:n}, (_, i) => rgbToHex(lerp(s, e, i/(n-1)))); }
const CATEGORICAL = ['#0D2240','#C8973A','#2E8B8B','#C0504D','#6A8D3A','#7B5AA6','#D97706','#3E6CA6','#B4478F','#4B9E6B','#8A6D2F','#5A6B8C'];

function DistributionPieChart({ data, labelMap, colorMap, height = 260 }) {
  const formatted = data.map(d => ({ ...d, name: (labelMap && labelMap[d.label]) ?? d.label }));
  const total = formatted.reduce((s, d) => s + d.count, 0);
  return h('div', { className: 'relative' },
    h(ResponsiveContainer, { width: '100%', height },
      h(PieChart, null,
        h(Pie, { data: formatted, dataKey: 'count', nameKey: 'name', cx: '50%', cy: '50%', innerRadius: 58, outerRadius: 92, paddingAngle: 2, isAnimationActive: ANIM },
          formatted.map((d, i) => h(Cell, { key: i, fill: (colorMap && colorMap[d.label]) ?? CATEGORICAL[i % CATEGORICAL.length] }))),
        h(Tooltip, { wrapperStyle: { zIndex: 50, outline: 'none' }, contentStyle: { fontSize: 12, borderRadius: 6, border: '1px solid #e5e7eb', background: '#fff' }, formatter: (v, n) => [`${v} (${total ? Math.round((Number(v) / total) * 100) : 0}%)`, n] }),
        h(Legend, { iconType: 'circle', iconSize: 10, wrapperStyle: { fontSize: 11 } }))),
    h('div', { className: 'overlay', style: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none', paddingBottom: 40 } },
      h('div', { style: { textAlign: 'center' } }, h('div', null, total), h('div', null, 'Total'))));
}

function GenderDonutChart({ data }) {
  const COLORS = ['#0D2240', '#C8973A', '#4a7fb5', '#8ba3c1'];
  const LABEL_MAP = { male: 'Male', female: 'Female', prefer_not_to_say: 'Not specified', other: 'Other' };
  const formatted = data.map(d => ({ ...d, name: LABEL_MAP[d.label] ?? d.label }));
  return h(ResponsiveContainer, { width: '100%', height: 260 },
    h(PieChart, null,
      h(Pie, { data: formatted, dataKey: 'count', nameKey: 'name', cx: '50%', cy: '50%', innerRadius: 70, outerRadius: 110, paddingAngle: 2, isAnimationActive: ANIM },
        formatted.map((_, i) => h(Cell, { key: i, fill: COLORS[i % COLORS.length] }))),
      h(Tooltip, { contentStyle: { fontSize: 12, borderRadius: 6, border: '1px solid #e5e7eb' }, formatter: (v) => [v ?? 0, 'Experts'] }),
      h(Legend, { iconType: 'circle', iconSize: 10, wrapperStyle: { fontSize: 12 } })));
}

function ExpertiseBarChart({ data }) {
  const colors = navyRamp(data.length);
  return h(ResponsiveContainer, { width: '100%', height: Math.max(280, data.length * 36) },
    h(BarChart, { data, layout: 'vertical', margin: { top: 4, right: 24, left: 4, bottom: 4 } },
      h(CartesianGrid, { strokeDasharray: '3 3', horizontal: false, stroke: '#e5e7eb' }),
      h(XAxis, { type: 'number', tick: { fontSize: 12, fill: '#6b7280' }, allowDecimals: false }),
      h(YAxis, { type: 'category', dataKey: 'label', width: 200, tick: { fontSize: 11, fill: '#374151' } }),
      h(Tooltip, { cursor: { fill: 'rgba(13,34,64,0.05)' }, contentStyle: { fontSize: 12, borderRadius: 6, border: '1px solid #e5e7eb' }, formatter: (v) => [v ?? 0, 'Experts'] }),
      h(Bar, { dataKey: 'count', radius: [0, 3, 3, 0], isAnimationActive: ANIM }, data.map((_, i) => h(Cell, { key: i, fill: colors[i] })))));
}

function VerticalBarChart({ data, fill, angled, bottom }) {
  return h(ResponsiveContainer, { width: '100%', height: 280 },
    h(BarChart, { data, margin: { top: 4, right: 16, left: 0, bottom } },
      h(CartesianGrid, { strokeDasharray: '3 3', vertical: false, stroke: '#e5e7eb' }),
      angled
        ? h(XAxis, { dataKey: 'label', tick: { fontSize: 11, fill: '#374151' }, angle: -40, textAnchor: 'end', interval: 0 })
        : h(XAxis, { dataKey: 'label', tick: { fontSize: 12, fill: '#374151' } }),
      h(YAxis, { tick: { fontSize: 12, fill: '#6b7280' }, allowDecimals: false }),
      h(Tooltip, { cursor: { fill: 'rgba(13,34,64,0.05)' }, contentStyle: { fontSize: 12, borderRadius: 6, border: '1px solid #e5e7eb' }, formatter: (v) => [v ?? 0, 'Experts'] }),
      h(Bar, { dataKey: 'count', fill, radius: [3, 3, 0, 0], isAnimationActive: ANIM })));
}

const DATA = window.CHART_DATA || {};
const W = (new URLSearchParams(location.search).get('w')) || '560';
const charts = [
  ['status', h(DistributionPieChart, { data: DATA.status, labelMap: DATA.statusLabels, colorMap: DATA.statusColors })],
  ['nationality', h(DistributionPieChart, { data: DATA.nationality })],
  ['gender', h(DistributionPieChart, { data: DATA.gender, labelMap: { male: 'Male', female: 'Female', prefer_not_to_say: 'Not specified', other: 'Other' } })],
  ['expertise', h(ExpertiseBarChart, { data: DATA.expertise })],
  ['grade', h(VerticalBarChart, { data: DATA.grade, fill: '#0D2240', angled: false, bottom: 16 })],
  ['language', h(VerticalBarChart, { data: DATA.language.slice(0, 15), fill: '#C8973A', angled: true, bottom: 60 })],
  ['natbar', h(VerticalBarChart, { data: DATA.natbar, fill: '#0D2240', angled: true, bottom: 60 })],
  ['genderdonut', h(GenderDonutChart, { data: DATA.gender })],
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null, charts.map(([id, el]) => h('div', { key: id, id, className: 'box', style: { '--w': W + 'px' } }, el)))
);
</script>
</body>
</html>
